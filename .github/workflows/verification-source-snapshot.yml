name: Verification source snapshot

on:
  push:
    branches: [fix/zakrpa-20260920-audit-guards]
    paths: [.github/workflows/verification-source-snapshot.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 14c339ba7e7e40e477851316026a1901191f82a8
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git rev-parse HEAD > source-revision.txt
          git archive --format=tar.gz --output=katedra-source.tar.gz HEAD
          sha256sum katedra-source.tar.gz > source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: katedra-verification-source
          path: |
            katedra-source.tar.gz
            source-revision.txt
            source-sha256.txt
          retention-days: 3
          if-no-files-found: error
