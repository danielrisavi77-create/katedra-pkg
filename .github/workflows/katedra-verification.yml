name: Katedra Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_api_billing:
        description: "Allow live Claude trigger eval with ANTHROPIC_API_KEY if no OAuth token is configured"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package-tests:
    name: Full package test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             python-docx pillow pytest fastapi httpx             numpy pandas matplotlib jsonschema

      - name: Run full Katedra suite
        run: bash bin/testovi.sh

      # Kvar 178: paralelne sesije uzimaju isti „sljedeći” broj kvara. Sudar se vidi ovdje,
      # u PR-u, a ne tek pri ručnom spajanju.
      - name: Kvar numbers do not collide with main
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin main
          python katedra/scripts/provjeri_sudar_kvarova.py --baza FETCH_HEAD

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katedra-test-log
          path: .testovi/zadnji.log
          if-no-files-found: ignore

  # Autor radi na Windowsu, a kvarovi 145, 159 i cp1250 ispis iz bin/testovi.sh
  # vidjeli su se tek na njegovom stroju, nikad u CI-ju. Ovaj job vrti isti suite
  # na windows-latest (Git Bash). Dok prvi put ne prođe zeleno, NE blokira PR
  # (continue-on-error); čim prođe, makni continue-on-error i dodaj ga u
  # obavezne provjere grane main.
  package-tests-windows:
    name: Full package test suite (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Provide python3 on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/py3"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/py3/python3"
          chmod +x "$RUNNER_TEMP/py3/python3"
          echo "$RUNNER_TEMP/py3" >> "$GITHUB_PATH"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx pillow pytest fastapi httpx numpy pandas matplotlib jsonschema

      - name: Run full Katedra suite
        run: bash bin/testovi.sh

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katedra-test-log-windows
          path: .testovi/zadnji.log
          if-no-files-found: ignore

  claude-trigger-eval:
    name: Live Claude trigger eval (auth-gated)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Claude authentication
        id: auth
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOW_API_BILLING: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_api_billing || false }}
        shell: bash
        run: |
          if [ -n "$OAUTH_TOKEN" ]; then
            echo "method=oauth" >> "$GITHUB_OUTPUT"
            echo "run_eval=true" >> "$GITHUB_OUTPUT"
            echo "Claude trigger eval: OAuth token available."
          elif [ -n "$API_KEY" ] && [ "$ALLOW_API_BILLING" = "true" ]; then
            echo "method=api" >> "$GITHUB_OUTPUT"
            echo "run_eval=true" >> "$GITHUB_OUTPUT"
            echo "Claude trigger eval: API key explicitly authorized for this manual run."
          elif [ -n "$API_KEY" ]; then
            echo "method=api-not-authorized" >> "$GITHUB_OUTPUT"
            echo "run_eval=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY exists, but automatic API billing is disabled. Use workflow_dispatch with allow_api_billing=true to run it."
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "run_eval=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret is configured. Live trigger eval skipped."
          fi

      - name: Install Claude Code
        if: steps.auth.outputs.run_eval == 'true'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude CLI
        if: steps.auth.outputs.run_eval == 'true'
        run: claude --version

      - name: Install project skills for Claude Code
        if: steps.auth.outputs.run_eval == 'true'
        shell: bash
        run: |
          mkdir -p .claude/skills
          for skill in katedra-lite katedra rad-audit rad-docx rad-orchestrator fpzg-diplomski replikacija-pspp; do
            cp -R "$skill" ".claude/skills/$skill"
          done

      - name: Set up Python
        if: steps.auth.outputs.run_eval == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run live trigger evaluation
        if: steps.auth.outputs.run_eval == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ steps.auth.outputs.method == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          python3 katedra-lite/evals/pokreni_trigger.py             --ponavljanja 3             --radnika 3             --timeout 180             --izlaz katedra-lite/evals/trigger_rezultat_ci.json

      - name: Upload trigger result
        if: always() && steps.auth.outputs.run_eval == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: katedra-trigger-eval
          path: katedra-lite/evals/trigger_rezultat_ci.json
          if-no-files-found: error
