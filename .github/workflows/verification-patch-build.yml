name: Verification patch build

on:
  push:
    branches: [fix/zakrpa-20260920-audit-guards]
    paths: [.github/workflows/verification-patch-build.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 14c339ba7e7e40e477851316026a1901191f82a8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify approved patch objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          repo = 'danielrisavi77-create/katedra-pkg'
          parts = ['bf3f2964882c42cbefbd88b8a4da9cf8679fc1fd', '8082d924cb967aabd3841d558f2370d75a241b8a', '18b5347d166b5bbfee39d4b7f7d0fab55baa6561']
          packed = b''
          for sha in parts:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = json.load(response)
              raw = base64.b64decode(data['content'])
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == sha
              packed += raw
          assert hashlib.sha256(packed).hexdigest() == 'b9f0293dfdadce13b7355d59406d8c1f1f1a6380295c61dad4f931f3705fd4a3'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '4efc5da70e101db85c1b8a854acde6b1880603e2c0b2fd683192697e0a4a51fc'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'approved.patch').write_bytes(patch)
          print('Approved patch hashes verified.')
          PY
      - name: Apply only the verified patch and check exact tree
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/approved.patch"
          git apply "$RUNNER_TEMP/approved.patch"
          git add -A
          test "$(git write-tree)" = c884756f8e9a2a0dc43b89346ddb3db13d3d1559
          git diff --cached --check
      - name: Install test dependencies
        run: python -m pip install python-docx pillow pytest fastapi httpx numpy pandas matplotlib jsonschema
      - name: Run every package group
        run: |
          set -euo pipefail
          bash bin/testovi.sh 2>&1 | tee "$RUNNER_TEMP/ci-package.log"
      - name: Upload verified Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'danielrisavi77-create/katedra-pkg'
          expected = 'c884756f8e9a2a0dc43b89346ddb3db13d3d1559'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True, encoding='utf-8').strip()
          def post(endpoint, payload):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/{endpoint}', data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          assert git('write-tree') == expected
          paths = git('diff', '--cached', '--name-only').splitlines()
          assert len(paths) == 24
          entries, files = [], {}
          for path in paths:
              assert not path.startswith('.github/') and '..' not in pathlib.PurePosixPath(path).parts
              raw = pathlib.Path(path).read_bytes()
              mode = git('ls-files', '--stage', '--', path).split()[0]
              assert mode in {'100644', '100755'}
              blob = post('blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              assert blob['sha'] == hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
              files[path] = hashlib.sha256(raw).hexdigest()
          tree = post('trees', {'base_tree': '26c46740441f9e78ab363bc35f23b9b3bcbb442e', 'tree': entries})
          assert tree['sha'] == expected
          result = {'base_sha': '14c339ba7e7e40e477851316026a1901191f82a8', 'verified_tree': tree['sha'], 'patch_sha256': '4efc5da70e101db85c1b8a854acde6b1880603e2c0b2fd683192697e0a4a51fc', 'package_exit_code': 0, 'run_id': os.environ['GITHUB_RUN_ID'], 'workflow_sha': os.environ['GITHUB_SHA'], 'files': files}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'verified-tree.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print('Verified tree uploaded; no branch or PR was modified.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: katedra-verified-repair-tree
          path: |
            ${{ runner.temp }}/ci-package.log
            ${{ runner.temp }}/verified-tree.json
          if-no-files-found: error
          retention-days: 14
